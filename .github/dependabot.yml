# Dependabot：依赖自动升级。
#
# 只开两个生态：
#   - pub：Flutter / Dart 依赖（pubspec.yaml + pubspec.lock）
#   - github-actions：workflow 里引用的 action 版本
# android/ 下的 Gradle 依赖不在这里升——AGP / Kotlin 版本由 Flutter SDK 模板决定，
# 跟着 flutter upgrade 走，让 Dependabot 单独改容易和模板打架。
#
# 合并策略（由 dependabot-auto-merge.yml 执行）：
#   - pub 的 patch 升级：合组一个 PR，CI 全绿后自动合并（CI 覆盖 analyze / test、
#     iOS 编译、web 编译与 SSH 冒烟）；
#   - pub 的 minor / major 升级：各自单独一个 PR，一律留给人——CI 只覆盖 Linux / iOS / web，
#     macOS / Windows / Android 的原生插件改动（window_manager 这类）CI 验不到；
#   - GitHub Actions 的更新：一律留给人——release.yml 里的 action 只有发版才跑，
#     PR 上的 CI 并不验证它们。
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 现有 ^ 约束已经允许的升级就别去抬高 pubspec.yaml 的下界，只更新 lockfile，
    # PR 的 diff 更干净，也少拿无意义的约束变更加剧合并冲突。
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 实际生效的是 dependency_overrides 指向的 third_party/xterm 补丁副本
      # （中文输入法上屏去重，见 third_party/README.md）。这里升名义版本号没有意义；
      # 上游合了修复后人工删掉 override 与 third_party/xterm 即可。
      - dependency-name: "xterm"
      # window_manager 0.6.0 是底层换成 nativeapi 的重写版：旧 API 挪到
      # package:window_manager/legacy.dart（@Deprecated 过渡桥），且 Linux 构建
      # 需要 GTK/X11 开发包、macOS 最低 10.15。迁移前冻结在 0.5.x；
      # 决定迁移时删掉这条 ignore（PR #4 已按此原因关闭，可 reopen 或重做）。
      - dependency-name: "window_manager"
        versions: [">=0.6.0"]
    groups:
      # 只给 patch 合组（自动合并的那批）；minor / major 各开各的 PR——
      # 某个包升不上去（比如 window_manager 0.6.0 要改 API）时不会拖住同组的其他包，
      # 也方便逐个审、逐个合。
      pub-patch:
        applies-to: "version-updates"
        update-types: ["patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
