<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="820" fill="#F6F7F9"/>
  <!-- 底层主界面（简化，被遮罩压暗）：demo-server 已存在，8 hosts -->
  <rect x="0" y="0" width="264" height="820" fill="#ECEEF2"/>
  <rect x="12" y="12" width="30" height="30" rx="8" fill="#101725"/>
  <g transform="translate(12 12) scale(0.0293)">
    <path d="M208 730 V294 L628 730 V294" fill="none" stroke="#EAF0FB" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="732" y="650" width="144" height="140" rx="34" fill="#4C8DFF"/>
  </g>
  <text x="52" y="25" font-size="13.5" font-weight="600" fill="#1D2430">NoShell</text>
  <text x="52" y="41" font-size="11" fill="#6E7683">8 hosts</text>
  <text x="448" y="69" font-size="16" font-weight="700" fill="#1D2430">demo-server</text>
  <text x="640" y="163" font-size="13" font-weight="600" fill="#1D2430" text-anchor="middle">Overview</text>
  <text x="640" y="185" font-size="15" font-weight="600" fill="#1D2430">Host address</text>
  <text x="640" y="217" font-size="15" font-weight="600" fill="#1D2430">127.0.0.1</text>
  <rect x="0" y="0" width="1280" height="820" fill="#000000" opacity="0.45"/>
  <!-- 凭据对话框 -->
  <rect x="333" y="251" width="613" height="302" rx="18" fill="#FFFFFF"/>
  <text x="357" y="294" font-size="18" font-weight="700" fill="#1D2430">Connect to "demo-server"</text>
  <text x="357" y="330" font-size="13.5" fill="#565D68">Credentials are used for this connection; check "Remember credentials" to store them securely.</text>
  <rect x="357" y="352" width="160" height="36" rx="18" fill="#D9E0F2"/>
  <text x="376" y="375" font-size="13" font-weight="600" fill="#2B4C8C">⇲ Password</text>
  <rect x="519" y="352" width="158" height="36" rx="18" fill="#FFFFFF" stroke="#D0D3DA"/>
  <text x="539" y="375" font-size="13" fill="#3C434E">⚿ SSH key</text>
  <rect x="357" y="398" width="565" height="42" rx="10" fill="#EEF0F4" stroke="#4C6FBF"/>
  <text x="372" y="393" font-size="12" fill="#4C6FBF">Password</text>
  <text x="372" y="424" font-size="15" letter-spacing="3" fill="#1D2430">•••••</text>
  <g stroke="#565D68" stroke-width="1.5" fill="none">
    <path d="M884 414 c8 -8 18 -8 26 0 M884 414 c8 8 18 8 26 0" opacity="0.001"/>
    <path d="M888 419 c3 -6 16 -6 20 0 M893 416 l4 6 M899 413 l4 6"/>
  </g>
  <rect x="372" y="458" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#A9AEB8" stroke-width="1.6"/>
  <text x="414" y="476" font-size="13.5" fill="#1D2430">Remember credentials</text>
  <text x="779" y="541" font-size="13.5" font-weight="500" fill="#2B4C8C" text-anchor="end">Cancel</text>
  <rect x="801" y="515" width="104" height="36" rx="18" fill="#3D5AA9"/>
  <text x="853" y="538" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Connect</text>
</svg>
